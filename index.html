<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 검색엔진 노출 방지: 가족/친구 공유 전용 페이지 -->
<meta name="robots" content="noindex, nofollow">

<title>유민이를 소개합니다</title>
<meta name="description" content="4살 유민이를 소개해요! 공룡, 토끼, 베베핀을 좋아하는 우리 유민이 이야기.">

<!-- ============================================ -->
<!-- 카카오톡 공유용 OG 메타태그
     ⚠️ SITE_URL은 아래 </body> 앞 <script>의 CONFIG.SITE_URL과
     같은 값으로 맞춰두세요. Netlify Drop 배포 후 실제 주소로
     두 곳 다 교체하고 다시 업로드해야 카톡 미리보기가 정상 노출됩니다. -->
<!-- ============================================ -->
<meta property="og:type" content="website">
<meta property="og:title" content="유민이를 소개합니다">
<meta property="og:description" content="4살, 어린이집 다니는 유민이예요. 공룡 · 토끼 · 베베핀을 제일 좋아해요!">
<meta property="og:image" content="https://yumin.netlify.app/image/2.jpg">
<meta property="og:url" content="https://yumin.netlify.app/">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="유민이를 소개합니다">
<meta name="twitter:description" content="4살, 어린이집 다니는 유민이예요. 공룡 · 토끼 · 베베핀을 제일 좋아해요!">
<meta name="twitter:image" content="https://yumin.netlify.app/image/2.jpg">

<!-- 파비콘: 공룡 이모지 인라인 SVG data URI -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20x%3D%2750%27%20y%3D%2778%27%20font-size%3D%2772%27%20text-anchor%3D%27middle%27%3E%F0%9F%A6%96%3C%2Ftext%3E%3C%2Fsvg%3E">

<!-- 본문 폰트: Pretendard -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<!-- 제목용 귀여운 한글 폰트: 주아체(Jua, Google Fonts) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>
  /* ===== 컬러/폰트 변수 ===== */
  :root{
    --cream:#FFFBF3;
    --card:#FFFFFF;
    --mint:#8FD8C8;
    --mint-light:#E8F7F2;
    --coral:#FF9F87;
    --coral-light:#FFEDE8;
    --text-title:#4A3B32;
    --text-body:#6B5D53;
    --shadow:rgba(74,59,50,.08);
    --font-body:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --font-title:'Jua',var(--font-body);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--text-body);
    font-family:var(--font-body);
    line-height:1.6;
  }
  img{display:block;max-width:100%;}

  /* ===== 히어로 섹션 ===== */
  .hero{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
    padding:24px 20px 56px;
  }
  .hero-bg{position:absolute;inset:0;background:var(--mint-light);}
  .hero-bg img{
    width:100%;height:100%;
    object-fit:cover;object-position:center 30%;
  }
  .hero-fallback{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-title);font-size:clamp(3rem,14vw,5rem);
    color:var(--coral);background:var(--coral-light);
  }
  /* 은은한 도트 패턴 */
  .hero-pattern{
    position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(circle,rgba(143,216,200,.4) 2px,transparent 2.5px),
      radial-gradient(circle,rgba(255,159,135,.35) 2px,transparent 2.5px);
    background-size:56px 56px,56px 56px;
    background-position:0 0,28px 28px;
  }
  .hero-overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,251,243,.1) 0%,rgba(255,251,243,.6) 55%,rgba(255,251,243,.94) 100%);
  }
  .hero-content{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
    max-width:640px;width:100%;
  }
  .profile-wrap{
    position:relative;
    width:clamp(120px,32vw,168px);
    aspect-ratio:1/1;
    border-radius:50%;
    overflow:hidden;
    border:6px solid #fff;
    box-shadow:0 12px 32px var(--shadow);
    background:var(--mint-light);
  }
  .profile-wrap img{width:100%;height:100%;object-fit:cover;object-position:center 30%;}
  .profile-fallback{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-title);font-size:clamp(2rem,10vw,3rem);
    color:var(--coral);background:var(--coral-light);
  }
  .badge{
    display:inline-block;margin:6px 0 0;
    background:var(--coral);color:#fff;
    font-family:var(--font-title);font-weight:400;
    font-size:clamp(1rem,3vw,1.25rem);
    padding:6px 22px;border-radius:999px;
    box-shadow:0 6px 16px var(--shadow);
  }
  .hero-title{
    font-family:var(--font-title);font-weight:400;
    font-size:clamp(2.5rem,10vw,4.5rem);
    color:var(--text-title);margin:6px 0 0;line-height:1.1;
  }
  .hero-sub{
    font-size:clamp(1.1rem,4vw,1.5rem);
    font-weight:600;color:var(--text-body);margin:0;
  }

  /* ===== 공통 섹션 ===== */
  main{max-width:640px;margin:0 auto;padding:0 20px;}
  .section{padding:56px 0;}
  .section-title{
    font-family:var(--font-title);font-weight:400;
    font-size:clamp(1.75rem,6vw,2.5rem);
    color:var(--text-title);text-align:center;margin:0 0 24px;
  }
  .section-text{
    font-size:clamp(1.05rem,3.5vw,1.25rem);
    line-height:1.8;text-align:center;margin:0 0 12px;
  }

  /* 스크롤 진입 페이드인
     기본값은 항상 "보임"! JS가 실행되는 브라우저에서만 .fade-ready를 붙여
     opacity:0으로 숨겼다가 스크롤 진입 시 .visible로 되살린다.
     JS가 아예 실행되지 않는 환경(카카오톡 인앱 파일 미리보기 등)에서도
     콘텐츠가 항상 보이도록 하기 위함. */
  .fade-section{opacity:1;transform:none;}
  .fade-section.fade-ready{
    opacity:0;transform:translateY(24px);
    transition:opacity .7s ease,transform .7s ease;
  }
  .fade-section.fade-ready.visible{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion:reduce){
    .fade-section{transition:none;opacity:1;transform:none;}
  }

  /* ===== 좋아하는 것 카드 ===== */
  .card-grid{
    display:grid;grid-template-columns:1fr;gap:20px;margin-top:32px;
  }
  @media (min-width:640px){
    .card-grid{grid-template-columns:repeat(3,1fr);}
  }
  .card{
    background:var(--card);border-radius:24px;padding:28px 20px;
    text-align:center;box-shadow:0 8px 24px var(--shadow);
    transition:transform .3s ease,box-shadow .3s ease;
  }
  .card:hover,.card:focus-within{
    transform:translateY(-8px);
    box-shadow:0 16px 32px var(--shadow);
  }
  @media (prefers-reduced-motion:reduce){
    .card{transition:none;}
    .card:hover,.card:focus-within{transform:none;}
  }
  .card-emoji{font-size:clamp(2.5rem,8vw,3.5rem);display:block;margin-bottom:10px;}
  .card-title{font-family:var(--font-title);font-weight:400;font-size:1.25rem;color:var(--text-title);margin:0 0 8px;}
  .card-desc{font-size:.95rem;line-height:1.6;margin:0;}

  /* ===== 사진첩 ===== */
  .album-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px;
  }
  .album-item{margin:0;}
  .img-frame{
    position:relative;width:100%;aspect-ratio:3/4;
    border-radius:24px;overflow:hidden;
    background:var(--mint-light);
    box-shadow:0 8px 20px var(--shadow);
  }
  .img-frame img{width:100%;height:100%;object-fit:cover;}
  .img-fallback{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-title);font-size:2.25rem;
    color:var(--coral);background:var(--coral-light);
  }

  /* hidden 속성이 display:flex보다 항상 이기도록 강제
     (동일 우선순위에서 클래스 규칙이 UA hidden 규칙을 덮어써 버리는 문제 방지) */
  .hero-fallback[hidden],
  .profile-fallback[hidden],
  .img-fallback[hidden]{
    display:none;
  }

  /* ===== 마무리 ===== */
  .outro{text-align:center;padding-bottom:88px;}
  .outro-text{
    font-family:var(--font-title);font-weight:400;
    font-size:clamp(1.5rem,6vw,2.25rem);color:var(--text-title);margin:0;
  }

  .footer{
    text-align:center;padding:24px 20px 40px;
    font-size:.85rem;color:var(--text-body);opacity:.7;
  }

  /* ===== 반응형 보정 ===== */
  @media (min-width:1280px){
    main{max-width:640px;}
  }
</style>
</head>
<body>

<!-- ============ Hero: 이름 · 나이 · 프로필 사진 ============ -->
<header class="hero" id="hero">
  <div class="hero-bg">
    <img id="heroImg" src="./image/2.jpg" width="2992" height="2992" alt="" onerror="handleImgError(this)">
    <div class="hero-fallback" hidden>유</div>
    <div class="hero-pattern" aria-hidden="true"></div>
    <div class="hero-overlay"></div>
  </div>
  <div class="hero-content">
    <div class="profile-wrap">
      <img id="profileImg" src="./image/2.jpg" width="2992" height="2992" alt="유민이 프로필 사진" onerror="handleImgError(this)">
      <div class="profile-fallback" hidden>유</div>
    </div>
    <p class="badge" id="badgeAge">4살</p>
    <h1 class="hero-title" id="heroName">김유민</h1>
    <p class="hero-sub" id="heroGreeting">나는 유민이야!</p>
  </div>
</header>

<main>
  <!-- ============ 나는 이런 사람이에요 =============
       ⚠️ 카카오톡 채팅창 내 파일 미리보기는 JS를 실행하지 않아
       아래 텍스트는 정적 HTML로 직접 넣어둠. 문구를 바꿀 땐
       이 아래 내용과 </body> 앞 CONFIG.about을 함께 수정할 것. -->
  <section class="section fade-section" id="about">
    <h2 class="section-title">나는 이런 사람이에요</h2>
    <div id="aboutText">
      <p class="section-text">나는 유민이야! 이제 4살이 됐어.</p>
      <p class="section-text">어린이집에 다니면서 선생님, 친구들이랑 신나게 놀아.</p>
      <p class="section-text">매일매일 재미있는 일이 가득해서 하루가 짧아!</p>
    </div>
  </section>

  <!-- ============ 내가 좋아하는 것 =============
       ⚠️ 위와 동일한 이유로 카드도 정적 HTML. 수정 시 CONFIG.likes도 함께. -->
  <section class="section fade-section" id="likes">
    <h2 class="section-title">내가 좋아하는 것</h2>
    <div class="card-grid" id="cardGrid">
      <div class="card">
        <span class="card-emoji" aria-hidden="true">🦖</span>
        <h3 class="card-title">공룡</h3>
        <p class="card-desc">공룡이 제일 좋아! 티라노가 최고야</p>
      </div>
      <div class="card">
        <span class="card-emoji" aria-hidden="true">🐰</span>
        <h3 class="card-title">토끼</h3>
        <p class="card-desc">토끼처럼 폴짝폴짝 뛰는 거 좋아해</p>
      </div>
      <div class="card">
        <span class="card-emoji" aria-hidden="true">⭐</span>
        <h3 class="card-title">베베핀</h3>
        <p class="card-desc">베베핀 노래 부르는 거 완전 좋아해</p>
      </div>
    </div>
  </section>

  <!-- ============ 사진첩 ============ -->
  <section class="section fade-section" id="album">
    <h2 class="section-title">사진첩</h2>
    <!-- webp 원본이 없어 jpg만 사용 (인앱 브라우저 깨짐 방지) -->
    <div class="album-grid">
      <figure class="album-item">
        <div class="img-frame">
          <img src="./image/1.jpg" width="1567" height="2090" alt="가족이랑 나들이 갔을 때 사진" loading="lazy" onerror="handleImgError(this)">
          <div class="img-fallback" hidden>유</div>
        </div>
      </figure>
      <figure class="album-item">
        <div class="img-frame">
          <img src="./image/2.jpg" width="2992" height="2992" alt="차 타고 가면서 활짝 웃는 나" loading="lazy" onerror="handleImgError(this)">
          <div class="img-fallback" hidden>유</div>
        </div>
      </figure>
    </div>
  </section>

  <!-- ============ 마무리 인사 ============ -->
  <section class="section fade-section outro" id="outro">
    <p class="outro-text" id="outroText">만나서 반가워요! 🦖</p>
  </section>
</main>

<footer class="footer">
  <p>© 2026 유민이네</p>
</footer>

<script>
  /* ==========================================================
     데이터 설정 객체
     이름 · 나이 · 소개 문구 · 좋아하는 것 등 페이지 텍스트 데이터를
     이 안에 모아둡니다. 내용만 바꾸면 화면 전체에 반영돼요.
  ========================================================== */
  const CONFIG = {
    // ⚠️ Netlify Drop 배포 후 실제 주소로 교체하고,
    // <head>의 og:image / og:url 메타태그도 같은 값으로 맞춰주세요.
    SITE_URL: 'https://yumin.netlify.app',

    name: '김유민',
    age: 4,
    greeting: '나는 유민이야!',

    about: [
      '나는 유민이야! 이제 4살이 됐어.',
      '어린이집에 다니면서 선생님, 친구들이랑 신나게 놀아.',
      '매일매일 재미있는 일이 가득해서 하루가 짧아!'
    ],

    likes: [
      { emoji: '🦖', title: '공룡', desc: '공룡이 제일 좋아! 티라노가 최고야' },
      { emoji: '🐰', title: '토끼', desc: '토끼처럼 폴짝폴짝 뛰는 거 좋아해' },
      { emoji: '⭐', title: '베베핀', desc: '베베핀 노래 부르는 거 완전 좋아해' }
    ],

    outro: '만나서 반가워요! 🦖',

    fallbackInitial: '유'
  };

  /* ===== 이미지 로드 실패 시 이니셜 폴백 ===== */
  function handleImgError(imgEl) {
    imgEl.hidden = true;
    const fallback = imgEl.nextElementSibling;
    if (fallback) {
      fallback.hidden = false;
      fallback.textContent = CONFIG.fallbackInitial;
    }
  }

  /* ===== CONFIG 데이터를 화면에 반영 =====
     이름/나이/인사말/마무리 문구는 정적 HTML과 값이 겹치더라도
     여기서 다시 채워 단일 소스를 유지한다. 소개글·카드는
     JS 미실행 환경 대응을 위해 정적 HTML에만 두고 여기서는 건드리지 않는다
     (문구 수정 시 위 about/likes 정적 HTML도 함께 수정할 것). */
  function render() {
    document.title = CONFIG.name + '를 소개합니다';
    document.getElementById('badgeAge').textContent = CONFIG.age + '살';
    document.getElementById('heroName').textContent = CONFIG.name;
    document.getElementById('heroGreeting').textContent = CONFIG.greeting;
    document.getElementById('outroText').textContent = CONFIG.outro;
  }

  /* ===== 섹션 진입 페이드인 (IntersectionObserver) =====
     .fade-section은 CSS 기본값이 "항상 보임"이라, JS가 아예 실행되지
     않는 환경(카카오톡 채팅창 내 파일 미리보기 등)에서도 콘텐츠가 보인다.
     JS가 정상 동작할 때만 .fade-ready를 붙여 애니메이션을 켜고,
     IntersectionObserver가 어떤 이유로든 감지 못해도 일정 시간 뒤
     무조건 보이게 하는 안전장치를 둔다. */
  function initFadeIn() {
    const sections = document.querySelectorAll('.fade-section');
    const revealAll = () => sections.forEach(el => el.classList.add('visible'));

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || !('IntersectionObserver' in window)) {
      return; // 기본 CSS만으로 이미 보이는 상태이므로 별도 처리 불필요
    }

    try {
      sections.forEach(el => el.classList.add('fade-ready'));

      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            obs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });

      sections.forEach(el => observer.observe(el));
    } catch (e) {
      revealAll();
      return;
    }

    // 안전장치: 옵저버가 어떤 이유로든 감지하지 못해도 콘텐츠는 반드시 보이게 함
    window.setTimeout(revealAll, 2000);
  }

  render();
  initFadeIn();
</script>
</body>
</html>
